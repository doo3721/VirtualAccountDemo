server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: VirtualAccountDemo
  config:
    import: optional:file:./application-local.yaml
  datasource:
    url: jdbc:h2:file:./data/virtual-account-demo
    username: sa
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  thymeleaf:
    cache: false

portone:
  api-secret: ${PORTONE_API_SECRET:}
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  webhook-url: ${PORTONE_WEBHOOK_URL:}
